<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <style>
    :root {
      --blue:#007d9c;
      --blue-dark:#005f73;
      --ink:#202224;
      --muted:#5f6368;
      --line:#dadce0;
      --soft:#f6f8fa;
      --soft-blue:#f4fafc;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      color:var(--ink);
      background:#fff;
      font-family:Arial, Helvetica, sans-serif;
      font-size:16px;
      line-height:1.55;
    }
    a { color:var(--blue-dark); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .topbar {
      height:56px;
      display:flex;
      align-items:center;
      gap:24px;
      padding:0 28px;
      border-bottom:1px solid var(--line);
      background:#fff;
      position:sticky;
      top:0;
      z-index:2;
    }
    .brand { font-size:22px; font-weight:700; color:var(--blue); letter-spacing:.2px; }
    .topbar nav { display:flex; gap:18px; flex-wrap:wrap; font-size:14px; }
    .page {
      max-width:1100px;
      margin:0 auto;
      padding:42px 28px 72px;
    }
    article > h1 {
      font-size:48px;
      line-height:1.08;
      margin:0 0 12px;
      font-weight:600;
      letter-spacing:0;
    }
    article > h1 + p {
      max-width:820px;
      font-size:20px;
      line-height:1.45;
      color:#384247;
      margin:0 0 24px;
    }
    article h2 {
      font-size:24px;
      line-height:1.2;
      margin:36px 0 12px;
      padding-top:20px;
      border-top:1px solid var(--line);
      font-weight:600;
    }
    article h3 {
      font-size:17px;
      margin:18px 0 6px;
    }
    article p { max-width:820px; margin:10px 0; }
    article ul {
      max-width:920px;
      margin:10px 0 18px;
      padding-left:24px;
    }
    article li { margin:5px 0; }
    article code {
      font-family:Menlo, Consolas, "Liberation Mono", monospace;
      font-size:.92em;
    }
    article p code,
    article li code {
      background:var(--soft);
      border:1px solid #e5e7eb;
      border-radius:3px;
      padding:1px 4px;
    }
    article pre {
      background:var(--soft-blue);
      border:1px solid #cfe3ea;
      border-radius:4px;
      overflow:auto;
      padding:14px 16px;
      max-width:920px;
    }
    article pre code {
      background:transparent;
      border:0;
      padding:0;
      color:#111827;
    }
    article table {
      width:100%;
      max-width:920px;
      border-collapse:collapse;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      font-size:14px;
      margin:14px 0 18px;
      display:block;
      overflow-x:auto;
    }
    article th,
    article td {
      text-align:left;
      vertical-align:top;
      padding:8px 10px;
      border-bottom:1px solid #e5e7eb;
      min-width:140px;
    }
    article th {
      background:#f8fafc;
      font-weight:600;
      white-space:nowrap;
    }
    .highlight .c { color:#6a737d; font-style:italic; }
    .highlight .k, .highlight .kd, .highlight .kn { color:#005f73; font-weight:600; }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb { color:#0b7285; }
    .highlight .m, .highlight .mi, .highlight .mf { color:#8a4baf; }
    .highlight .o { color:#6b21a8; }
    footer {
      max-width:1100px;
      margin:0 auto;
      padding:18px 28px 36px;
      color:var(--muted);
      border-top:1px solid var(--line);
      font-size:14px;
    }
    @media (max-width:720px) {
      .topbar { height:auto; align-items:flex-start; flex-direction:column; gap:8px; padding:14px 20px; position:static; }
      .topbar nav { gap:12px; }
      .page { padding:28px 20px 56px; }
      article > h1 { font-size:36px; }
      article > h1 + p { font-size:18px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}">Leia</a>
    <nav aria-label="Primary">
      <a href="{{ '/spec/' | relative_url }}">Spec</a>
      <a href="{{ '/playground.html' | relative_url }}">Playground</a>
      <a href="{{ '/reference/cli/' | relative_url }}">CLI</a>
      <a href="{{ '/guides/embedding.html' | relative_url }}">Embedding</a>
      <a href="{{ '/reference/dialects/' | relative_url }}">Dialects</a>
      <a href="{{ '/reference/performance/' | relative_url }}">Performance</a>
    </nav>
  </header>
  <main class="page">
    <article>
      {{ content }}
    </article>
  </main>
  <footer>Leia documentation is generated from the repository sources.</footer>
</body>
</html>
