<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title | escape }}</title>
  <style>
    :root {
      --blue:#007d9c;
      --blue-dark:#005f73;
      --ink:#202224;
      --muted:#5f6368;
      --line:#dadce0;
      --soft-line:#e5e7eb;
      --code-bg:#f6f8fa;
      --spec-bg:#fff;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      color:var(--ink);
      background:var(--spec-bg);
      font-family:Arial, Helvetica, sans-serif;
      font-size:16px;
      line-height:1.55;
    }
    a { color:var(--blue-dark); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .topbar {
      height:56px;
      display:flex;
      align-items:center;
      gap:18px;
      padding:0 24px;
      border-bottom:1px solid var(--line);
      background:#fff;
      position:sticky;
      top:0;
      z-index:3;
    }
    .brand { font-size:22px; font-weight:700; color:var(--blue); letter-spacing:.2px; }
    .topbar .section { color:var(--muted); font-size:14px; }
    .shell {
      display:grid;
      grid-template-columns:260px minmax(0, 920px);
      gap:42px;
      max-width:1280px;
      margin:0 auto;
      padding:28px 32px 72px;
    }
    .toc {
      position:sticky;
      top:76px;
      align-self:start;
      max-height:calc(100vh - 96px);
      overflow:auto;
      border-right:1px solid var(--line);
      padding-right:20px;
    }
    .toc h2 {
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--muted);
      margin:0 0 10px;
      border:0;
      padding:0;
    }
    .toc-details > summary { display:none; }
    .toc ol { list-style:none; margin:0; padding:0; }
    .toc li { margin:0; }
    .toc a {
      display:block;
      padding:5px 0;
      font-size:14px;
      line-height:1.35;
      color:#394247;
      white-space:normal;
    }
    main { min-width:0; }
    article > h1 {
      font-size:34px;
      line-height:1.16;
      margin:0 0 10px;
      font-weight:500;
    }
    article h2 {
      font-size:28px;
      line-height:1.2;
      font-weight:500;
      margin:38px 0 14px;
      padding-top:18px;
      border-top:1px solid var(--line);
    }
    article h1 + p,
    article h1 + p + p {
      color:var(--muted);
      max-width:820px;
    }
    article h2:first-of-type { border-top:0; padding-top:0; }
    article h3 { font-size:21px; line-height:1.25; font-weight:500; margin:28px 0 10px; }
    article h4 { font-size:17px; line-height:1.3; font-weight:700; margin:22px 0 8px; }
    article p { margin:10px 0; max-width:820px; }
    article ul, article ol { max-width:820px; padding-left:28px; }
    article li { margin:5px 0; }
    article code {
      font-family:Menlo, Consolas, "Liberation Mono", monospace;
      font-size:.92em;
    }
    article p code,
    article li code,
    article td code {
      background:var(--code-bg);
      border:1px solid var(--soft-line);
      border-radius:3px;
      padding:1px 4px;
    }
    article pre,
    article .highlight {
      background:var(--code-bg);
      border:1px solid var(--line);
      border-radius:4px;
      overflow:auto;
      max-width:920px;
    }
    article pre { padding:14px 16px; }
    article .highlight pre {
      border:0;
      border-radius:0;
      margin:0;
      max-width:none;
    }
    article pre code {
      background:transparent;
      border:0;
      padding:0;
      color:#111827;
    }
    article pre:has(code.language-leia),
    article .language-leia.highlighter-rouge .highlight {
      background:#f8fbfd;
      border-color:#cfe3ea;
    }
    article table {
      width:100%;
      max-width:920px;
      border-collapse:collapse;
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      font-size:14px;
      margin:14px 0 18px;
      display:block;
      overflow-x:auto;
    }
    article thead, article tbody, article tr { width:100%; }
    article th, article td {
      text-align:left;
      vertical-align:top;
      padding:8px 10px;
      border-bottom:1px solid var(--soft-line);
      min-width:120px;
    }
    article th {
      font-weight:600;
      background:#f8fafc;
      color:#1f2937;
      white-space:nowrap;
    }
    article tr:last-child td { border-bottom:0; }
    .highlight .c, .tok-comment { color:#6a737d; font-style:italic; }
    .highlight .k, .highlight .kd, .highlight .kn, .tok-keyword { color:#005f73; font-weight:600; }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb, .tok-string { color:#0b7285; }
    .highlight .m, .highlight .mi, .highlight .mf, .tok-number { color:#8a4baf; }
    .highlight .kc, .tok-constant { color:#9a3412; font-weight:600; }
    .highlight .nf, .highlight .nb, .tok-builtin { color:#0369a1; }
    .highlight .o, .highlight .ow, .tok-operator { color:#6b21a8; }
    .tok-dialect { color:#7c3aed; font-weight:600; }
    footer {
      color:var(--muted);
      border-top:1px solid var(--line);
      margin-top:42px;
      padding-top:18px;
      font-size:14px;
    }
    @media (max-width:900px) {
      .shell { display:block; padding:20px; }
      .toc {
        position:static;
        max-height:none;
        border-right:0;
        border-bottom:1px solid var(--line);
        padding:0 0 18px;
        margin-bottom:24px;
      }
      .toc-details > summary {
        display:list-item;
        cursor:pointer;
        color:var(--blue-dark);
        font-size:14px;
        font-weight:600;
        padding:8px 0;
      }
      .toc-details[open] > summary { margin-bottom:6px; }
      .toc h2 {
        position:absolute;
        width:1px;
        height:1px;
        padding:0;
        margin:-1px;
        overflow:hidden;
        clip:rect(0, 0, 0, 0);
        white-space:nowrap;
        border:0;
      }
      .toc ol { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); column-gap:24px; }
      .topbar { padding:0 18px; }
    }
    @media (max-width:560px) {
      .toc ol { grid-template-columns:1fr; }
      article > h1 { font-size:28px; }
      article h2 { font-size:24px; }
    }
  </style>
</head>
<body>
  <div class="topbar"><a class="brand" href="{{ '/' | relative_url }}">Leia</a><span class="section">Language Specification</span></div>
  <div class="shell">
    <nav class="toc" aria-label="Table of contents">
      <details class="toc-details" open>
        <summary>Contents</summary>
        <h2>Contents</h2>
        <ol id="spec-toc"></ol>
      </details>
    </nav>
    <main>
      <article id="spec-content">
        {{ content }}
      </article>
      <footer>Generated from the Markdown sources in <code>docs/spec/</code>.</footer>
    </main>
  </div>
  <script>
    (function () {
      var article = document.getElementById("spec-content");
      var toc = document.getElementById("spec-toc");
      var tocDetails = document.querySelector(".toc-details");
      var mobileTOC = window.matchMedia("(max-width: 900px)");
      if (tocDetails && mobileTOC.matches) tocDetails.removeAttribute("open");
      if (!article || !toc) return;

      var headingIDs = new Set();
      article.querySelectorAll("h1, h2, h3, h4, h5, h6").forEach(function (heading) {
        var base = heading.id || heading.textContent.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "section";
        var id = base;
        var suffix = 2;
        while (headingIDs.has(id)) {
          id = base + "-" + suffix;
          suffix++;
        }
        heading.id = id;
        headingIDs.add(id);
        if (heading.tagName !== "H2") return;
        var item = document.createElement("li");
        var link = document.createElement("a");
        link.href = "#" + heading.id;
        link.textContent = heading.textContent;
        item.appendChild(link);
        toc.appendChild(item);
      });

      var keywords = new Set("break chan const continue defer else elseif for func go goto if in range return var".split(" "));
      var constants = new Set("false nil true".split(" "));
      var builtins = new Set("assert cap close collectgarbage dofile error getmetatable ipairs len load loadfile loadstring next pairs pcall print rawequal rawget rawlen rawset require select setmetatable spread tonumber tostring type unpack xpcall".split(" "));
      var token = /("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`[^`]*`|\/\/[^\n]*|\/\*[\s\S]*?\*\/|\b0[xX][0-9A-Fa-f_]+\b|\b0[bB][01_]+\b|\b0[oO][0-7_]+\b|\b\d+(?:_\d+)*(?:\.\d+(?:_\d+)*)?(?:[eE][+-]?\d+(?:_\d+)*)?\b|\b[A-Za-z_][A-Za-z0-9_]*\b|\.\.\.|\+\+|--|\+=|-=|\*=|\/=|:=|==|!=|<=|>=|&&|\|\||&\^|<<|>>|<-|\.\.|\*\*|[+\-*\/%=<>!#&|^])/g;

      function escapeHTML(text) {
        return text.replace(/[&<>]/g, function (ch) {
          return ch === "&" ? "&amp;" : ch === "<" ? "&lt;" : "&gt;";
        });
      }

      function classify(part) {
        if (/^(\/\/|\/\*)/.test(part)) return "tok-comment";
        if (/^["'`]/.test(part)) return "tok-string";
        if (/^(?:0[xX]|0[bB]|0[oO]|\d)/.test(part)) return "tok-number";
        if (keywords.has(part)) return "tok-keyword";
        if (constants.has(part)) return "tok-constant";
        if (builtins.has(part)) return "tok-builtin";
        if (/^(?:\.\.\.|\+\+|--|\+=|-=|\*=|\/=|:=|==|!=|<=|>=|&&|\|\||&\^|<<|>>|<-|\.\.|\*\*|[+\-*\/%=<>!#&|^])$/.test(part)) return "tok-operator";
        return "";
      }

      function highlightDialect(tag, body) {
        return '<span class="tok-string">' + escapeHTML(body) + "</span>";
      }

      function highlightLeia(text) {
        var html = "";
        var i = 0;
        var tagPattern = /[A-Za-z_][A-Za-z0-9_]*!?/y;
        while (i < text.length) {
          tagPattern.lastIndex = i;
          var tagMatch = tagPattern.exec(text);
          if (tagMatch) {
            var tag = tagMatch[0];
            var bareTag = tag.replace(/!$/, "");
            var after = tagPattern.lastIndex;
            if (text.slice(after, after + 3) === "```") {
              var end = text.indexOf("```", after + 3);
              if (end !== -1) {
                html += '<span class="tok-dialect">' + escapeHTML(tag) + "</span><span class=\"tok-string\">```</span>";
                html += highlightDialect(bareTag, text.slice(after + 3, end));
                html += '<span class="tok-string">```</span>';
                i = end + 3;
                continue;
              }
            }
            if (text[after] === "`") {
              var close = text.indexOf("`", after + 1);
              if (close !== -1) {
                html += '<span class="tok-dialect">' + escapeHTML(tag) + "</span><span class=\"tok-string\">`</span>";
                html += highlightDialect(bareTag, text.slice(after + 1, close));
                html += '<span class="tok-string">`</span>';
                i = close + 1;
                continue;
              }
            }
          }
          token.lastIndex = i;
          var match = token.exec(text);
          if (!match || match.index !== i) {
            html += escapeHTML(text[i]);
            i++;
            continue;
          }
          var part = match[0];
          var cls = classify(part);
          html += cls ? '<span class="' + cls + '">' + escapeHTML(part) + "</span>" : escapeHTML(part);
          i = token.lastIndex;
        }
        return html;
      }

      article.querySelectorAll("pre code.language-leia, .language-leia.highlighter-rouge code").forEach(function (code) {
        code.innerHTML = highlightLeia(code.textContent);
      });
    })();
  </script>
</body>
</html>
