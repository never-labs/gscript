name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LUA_BIN: luajit
      LEIA_CONFORMANCE_CHECK_JIT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/tree-sitter-leia/package-lock.json
      - if: github.ref_type == 'tag'
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tags must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: npm ci --prefix tools/tree-sitter-leia
      - run: go install github.com/goreleaser/goreleaser/v2@v2.16.0
      - run: '"$(go env GOPATH)/bin/goreleaser" --version'
      - run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export LEIA_RELEASE_REQUIRE_TAG=1
            export LEIA_RELEASE_ARTIFACT_VERSION="${GITHUB_REF_NAME}"
          fi
          go run ./cmd/leia ci release
      - if: github.event_name == 'workflow_dispatch'
        run: '"$(go env GOPATH)/bin/goreleaser" release --snapshot --clean --skip=publish'
      - if: github.event_name == 'push'
        run: '"$(go env GOPATH)/bin/goreleaser" release --clean'
