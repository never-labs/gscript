name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / full PR gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: echo "LUA_BIN=luajit" >> "$GITHUB_ENV"
      - run: go run ./cmd/leia ci pr --no-luajit

  macos:
    name: macOS / smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Report runner architecture
        run: go env GOOS GOARCH
      - run: go run ./cmd/leia ci smoke

  vet:
    name: Go vet (except audited unsafeptr paths)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The runtime has audited unsafe hot paths. Keep every other vet analyzer enabled.
      - run: go vet -unsafeptr=false $(scripts/go_packages.sh)

  race:
    name: Race detector / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: scripts/run.sh test race-smoke

  q-extension:
    name: Optional extension / q (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y luajit
      - run: echo "LUA_BIN=luajit" >> "$GITHUB_ENV"
      - run: go test -tags leia_q $(scripts/go_packages.sh) -count=1
