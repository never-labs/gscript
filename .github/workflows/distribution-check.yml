name: Distribution Check

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/distribution-check.yml
      - .github/workflows/pages.yml
      - docs/_config.yml
      - docs/release/**
      - docs/reference/platforms/index.md
      - README.md
      - SECURITY.md
      - LICENSE
      - .goreleaser.yaml
      - scripts/install.sh
      - scripts/production_check.sh
      - scripts/public_release_blockers_check.sh
      - scripts/release_notes_check.sh
      - scripts/release_distribution_check.sh
      - scripts/release_artifacts*.sh
      - go.mod
      - go.sum
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/goreleaser/goreleaser/v2@v2.16.0
      - run: '"$(go env GOPATH)/bin/goreleaser" --version'
      - run: bash scripts/release_notes_check.sh
      - run: bash scripts/release_distribution_check.sh --require-goreleaser --require-workflows
      - run: '"$(go env GOPATH)/bin/goreleaser" release --snapshot --clean --skip=publish'
